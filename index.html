<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ace Efrem - Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="desktop">

  <div class="app-window">

    <!-- =====================================================
         WIN98 TITLE BAR (window identity lives here)
    ====================================================== -->
<div class="title-bar">

    <div class="title-text">
        Portfolio Terminal
    </div>

    <div class="title-right">

        <div class="window-controls">
            <div class="btn minimize">-</div>
            <div class="btn maximize">□</div>
            <div class="btn close">X</div>
        </div>

    </div>

</div>


    <!-- =====================================================
     FAKE BROWSER TAB BAR (ONLY tabs, no header content >:c )
    ====================================================== -->
    <div class="browser-bar">

        <div class="tab active">Profile</div>
        <div class="tab">New Tab</div>

    </div>


    <!-- =====================================================
         MAIN SCROLL AREA (the actual browser)
    ====================================================== -->
    <div class="app-content">

      
<!-- =====================================================
     MYSPACE HEADER (THIS is where nav belongs)
===================================================== -->
<div class="myspace-header">

    <div class="myspace-top-row">
        <div class="myspace-title">
            Ace Efrem
        </div>

        <div id="splash-text" class="splash-text">
            loading...
        </div>
    </div>

    <div class="myspace-subtitle">
        Aspiring <span id="role-text">I.T. Specialist</span>
    </div>

    <div class="header-nav">
        <a href="#about">About</a>
        <a href="#experience">Work</a>
        <a href="#education">Education</a>
        <a href="#extracurriculars">Extracurriculars</a>
        <a href="#projects">Projects</a>
    </div>

</div>

      <!-- ================= MAIN LAYOUT ================= -->
      <div class="myspace-layout">

          <div class="left-column">
              LEFT PROFILE PANEL
          </div>

          <div class="right-column">
              MAIN CONTENT
          </div>

      </div>

    </div>

  </div>

</div>

<!--========================================================
    SPLASH TEXT SCRIPT (rotating minecraft-style text)
========================================================-->
<script>

const splashes = [

    // list of minecrafty rotating phrases
    "Over 1000 lines of code!",
    "Inspired by Win98",
    "Try clicking random things",
    "Don't close the tab",
    "Splash text made with JS",
    "This took awhile..."
];

let i = 0; // "i" is a counter relating to which phrase is currently in play

const splash = document.getElementById("splash-text"); // grabs splash text element

function rotateSplash() { // changes the text everytime it runs
    i = (i + 1) % splashes.length; // move to next item in list
    splash.textContent = splashes[i]; // replace the text on the page
}

// lowkey havent used JS since elementary school this was hard
setInterval(rotateSplash, 2000);

</script>

</body>
</html>
