<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ace Efrem - Portfolio</title>
</head>
<body>

<div class="desktop">

    <!-- fake desktop background layer -->
    <div class="desktop-background"></div>

    <!-- THE APP WINDOW -->
    <div class="app-window">

        <!-- top bar (classic OS) -->
        <div class="title-bar">

            <div class="title-buttons">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="title-text">
                Ace Efrem - MySpace Terminal
            </div>

        </div>

        <!-- THIS is your scroll container -->
        <div class="app-content">

            <!-- HEADER (we move your site header later) -->
            <header class="site-header">
                <div class="site-name">Ace Efrem</div>
            </header>

            <!-- EVERYTHING ELSE GOES HERE -->
            <main class="site">

                <section class="page-placeholder">
                    <h1>Loading profile...</h1>
                    <p>Welcome back in time</p>
                </section>

            </main>

        </div>

    </div>

</div>

</body>
</html>
